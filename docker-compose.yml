# Run the app in a container. Pass the env file for the environment you're in:
#
#   homelab   :  docker compose --env-file .env.production up --build -d
#   local dev :  ENV_FILE=.env.local docker compose --env-file .env.local up --build
#
# Two separate mechanisms, both reading your env file so you never list vars here:
#   build.args -> NEXT_PUBLIC_* must be baked into the client bundle at BUILD time,
#                 so they're interpolated from the file --env-file points at.
#   env_file   -> the WHOLE file is handed to the running container at RUNTIME, so
#                 every server-only secret (SERVICE_ROLE_KEY, CLEANUP_SECRET,
#                 RESEND_API_KEY, EMAIL_FROM, …) flows through without enumeration.
#                 Add a var to .env.production and it's available — no edit here.
#
# ENV_FILE selects which file env_file loads (defaults to .env.production, the
# homelab case). For local Docker dev, prefix the command with ENV_FILE=.env.local
# so the same file feeds both build args and the runtime environment.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file:
      - ${ENV_FILE:-.env.production}
    ports:
      # Host port is configurable so a local override (e.g. 3026) lives in your
      # gitignored env file, not here — no merge conflicts on pull. Container
      # always listens on 3000.
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped
