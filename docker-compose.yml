# Run the app in a container. Pass the env file for the environment you're in:
#
#   local dev :  docker compose --env-file .env.local up --build
#   homelab   :  docker compose --env-file .env.production up --build -d
#
# Compose only auto-loads a file literally named `.env`; --env-file points it at
# whichever file you choose, and EVERYTHING below — both the build args and the
# runtime environment — reads from that one file. So the homelab needs only
# .env.production present; .env.local is just your local dev copy.
#
# Split of responsibilities:
#   build.args   -> NEXT_PUBLIC_* baked into the client bundle at build time.
#   environment  -> all vars (incl. the server-only secrets) handed to the
#                   running container, where Server Actions read them per request.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CLEANUP_SECRET: ${CLEANUP_SECRET}
    ports:
      - "3000:3000"
    restart: unless-stopped
