# Run the app in a container, sourcing all config from .env.local.
#
#   docker compose --env-file .env.local up --build
#
# Why the --env-file flag: Compose only auto-loads a file named `.env`, but this
# project keeps its config in `.env.local`. Pointing --env-file at it makes the
# ${...} build args below resolve from the same file.
#
# Split of responsibilities:
#   build.args  -> NEXT_PUBLIC_* only; inlined into the client bundle at build.
#   env_file    -> injects ALL vars (incl. the server-only secrets) into the
#                  running container, where Server Actions / route handlers
#                  read them at request time.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    restart: unless-stopped
